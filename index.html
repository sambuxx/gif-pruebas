
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GIF Text Generator</title>

    <!-- gif.js - creates animated GIFs in the browser -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>

    <style>
        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 800px;
            text-align: center;
        }

        img {
            max-width: 100%;
            margin-top: 20px;
        }

        #status {
            margin-top: 15px;
            color: #aaa;
        }

        canvas {
            display: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>GIF Text Generator</h1>

    <p id="status">Loading GIF...</p>

    <img id="result" style="display:none;">

    <canvas id="canvas"></canvas>

</div>

<script>
/*
    ==========================================
    SETTINGS
    ==========================================
*/

const GIF_URL = "prueba.gif";

/*
    Text comes from:

    ?text=Hello

    Example:

    https://sambuxx.github.io/gif-pruebas/?text=Hello
*/

const params = new URLSearchParams(window.location.search);

const text = params.get("text") || "Hello";


/*
    ==========================================
    ELEMENTS
    ==========================================
*/

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const result = document.getElementById("result");
const status = document.getElementById("status");


/*
    ==========================================
    LOAD GIF
    ==========================================
*/

const gifImage = new Image();

gifImage.crossOrigin = "anonymous";

gifImage.onload = function () {

    canvas.width = gifImage.width;
    canvas.height = gifImage.height;

    createGif();

};

gifImage.onerror = function () {

    status.textContent = "Could not load prueba.gif.";

};

gifImage.src = GIF_URL;


/*
    ==========================================
    CREATE GIF
    ==========================================
*/

function createGif() {

    status.textContent = "Creating GIF...";

    /*
        Create GIF encoder.
    */

    const gif = new GIF({

        workers: 2,

        quality: 10,

        width: gifImage.width,

        height: gifImage.height,

        workerScript:
            "https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js"

    });


    /*
        IMPORTANT:

        A normal <img> element only gives us
        the rendered GIF animation.

        Capturing the animation frame-by-frame
        requires repeatedly drawing it to canvas.

        This simple version captures frames
        based on a timer.
    */


    const frameDelay = 100;

    let frame = 0;

    const totalFrames = 30;


    function captureFrame() {

        /*
            Draw the current GIF frame.
        */

        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        ctx.drawImage(
            gifImage,
            0,
            0,
            canvas.width,
            canvas.height
        );


        /*
            ======================================
            TEXT
            ======================================
        */

        ctx.font = "bold 40px Arial";

        ctx.textBaseline = "top";

        /*
            Black shadow/outline.
        */

        ctx.fillStyle = "black";

        ctx.fillText(
            text,
            12,
            12
        );


        /*
            White text.
        */

        ctx.fillStyle = "white";

        ctx.fillText(
            text,
            10,
            10
        );


        /*
            Add this frame to GIF.
        */

        gif.addFrame(
            canvas,
            {
                copy: true,
                delay: frameDelay
            }
        );


        frame++;

        status.textContent =
            "Processing frame " +
            frame +
            " / " +
            totalFrames;


        if (frame < totalFrames) {

            setTimeout(
                captureFrame,
                frameDelay
            );

        } else {

            finishGif();

        }

    }


    /*
        Start capturing.
    */

    captureFrame();


    /*
        ======================================
        FINISH
        ======================================
    */

    function finishGif() {

        status.textContent = "Rendering GIF...";


        gif.on("finished", function (blob) {

            const url =
                URL.createObjectURL(blob);

            result.src = url;

            result.style.display = "block";

            status.textContent =
                "Done! Text: " + text;

        });


        gif.render();

    }

}
</script>

</body>
</html>
